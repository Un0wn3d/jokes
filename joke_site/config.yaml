name: "Joke Site"
version: "1.1.0"
slug: joke_site
description: "Шуточный хакерский сайт (nginx) с отправкой хода прохождения в вебхук Home Assistant"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ports:
  80/tcp: 8099
ports_description:
  80/tcp: "Сайт (сюда направьте Cloudflare Tunnel)"
options:
  webhook_id: ""
  log_level: "info"
  log_requests: true
schema:
  webhook_id: str
  log_level: list(error|warn|notice|info)
  log_requests: bool
